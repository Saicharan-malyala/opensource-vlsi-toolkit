<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="16" fill="url(#bgA)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Host Platform -->
  <rect x="30" y="30" width="410" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="235" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    🖥️ LOCAL HOST MACHINE (Linux / WSL2)
  </text>
  
  <rect x="50" y="85" width="370" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="65" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Host Binaries &amp; Simulators</text>
  <text x="65" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• iverilog &amp; Verilator (Cycle Simulation)</text>
  <text x="65" y="154" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• GTKWave (GUI Waveforms) &amp; ngspice (SPICE)</text>

  <rect x="50" y="190" width="370" height="155" rx="8" fill="#1e1e38" stroke="#a855f7" stroke-width="1.5"/>
  <text x="65" y="217" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Python Virtual Environment (~/.eda_venv)</text>
  <text x="65" y="242" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• LibreLane 3.0 CLI (Flow Orchestrator)</text>
  <text x="65" y="262" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• Ciel 3.0 PDK Manager (Package manager)</text>
  <text x="65" y="282" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• cocotb &amp; pyuvm (Python verification)</text>
  <text x="65" y="315" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">PDK Cache: ~/.ciel/sky130A (SkyWater 130nm)</text>

  <!-- Connection Arrows -->
  <path d="M 440 260 L 510 260" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrA)"/>
  <text x="475" y="245" fill="#f97316" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Docker</text>
  <text x="475" y="280" fill="#f97316" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Mount</text>

  <!-- Right: Docker Execution Engine -->
  <rect x="510" y="30" width="380" height="340" rx="12" fill="#1e1528" stroke="#ea580c" stroke-width="2"/>
  <text x="700" y="60" fill="#f97316" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    🐳 DOCKER ENGINE BACKEND
  </text>
  <text x="700" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Invoked via 'librelane --dockerized'
  </text>

  <rect x="530" y="100" width="340" height="245" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
  <text x="550" y="132" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Containerized Toolchain:</text>
  <text x="550" y="162" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Yosys (RTL Synthesis)</text>
  <text x="550" y="192" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• OpenROAD (Floorplan, Placement, CTS, Routing)</text>
  <text x="550" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• OpenSTA (Static Timing Analysis Signoff)</text>
  <text x="550" y="252" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Magic (DRC) &amp; Netgen (LVS)</text>
  <text x="550" y="282" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• KLayout (GDSII / OASIS Streamout)</text>
  <text x="550" y="315" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Output: Final DRC/LVS Clean GDSII</text>
</svg>