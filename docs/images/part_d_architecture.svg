<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrD" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="380" rx="16" fill="url(#bgD)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Windows Host System -->
  <rect x="30" y="30" width="380" height="320" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    🪟 WINDOWS 10 / 11 HOST
  </text>
  
  <rect x="50" y="85" width="340" height="65" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="65" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PowerShell Administrator Setup</text>
  <text x="65" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">.\scripts\wsl\wsl_setup.ps1 (Automated install)</text>

  <rect x="50" y="165" width="340" height="165" rx="8" fill="#131c2e" stroke="#a855f7" stroke-width="1.5"/>
  <text x="65" y="195" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">WSL2 Ubuntu Virtual Machine</text>
  <text x="65" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Native Linux Filesystem: ~/eda_tools/</text>
  <text x="65" y="247" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• WSLg Display (Direct GUI windows)</text>
  <text x="65" y="272" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Docker Desktop WSL2 Engine integration</text>
  <text x="65" y="302" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">High Performance Linux Kernel</text>

  <!-- Center Arrow -->
  <path d="M 410 190 L 510 190" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrD)"/>
  <text x="460" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ready</text>
  <text x="460" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">State</text>

  <!-- Right: Native Linux & Execution Target -->
  <rect x="510" y="30" width="380" height="320" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="60" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    🐧 NATIVE LINUX OR WSL2 TARGET
  </text>
  <text x="700" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Ubuntu, Debian, Fedora, Arch
  </text>

  <rect x="530" y="100" width="340" height="100" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
  <text x="550" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">System Docker Group</text>
  <text x="550" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• sudo usermod -aG docker $USER</text>
  <text x="550" y="176" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Seamless non-root container commands</text>

  <rect x="530" y="220" width="340" height="110" rx="8" fill="#1e1e38" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="248" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Launch Selected Path:</text>
  <text x="550" y="274" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• ./install_all.sh --path a (LibreLane)</text>
  <text x="550" y="298" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• ./install_all.sh --path b (IIC-OSIC-TOOLS)</text>
</svg>