<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="16" fill="url(#bgB)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Host System -->
  <rect x="30" y="30" width="370" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="215" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    💻 HOST SYSTEM (Windows / Linux)
  </text>
  
  <rect x="50" y="90" width="330" height="95" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="65" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Host Design Workspace</text>
  <text x="65" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Path: $HOME/eda/designs/</text>
  <text x="65" y="164" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Live two-way filesystem sync</text>

  <rect x="50" y="210" width="330" height="135" rx="8" fill="#131c2e" stroke="#059669" stroke-width="1.5"/>
  <text x="65" y="238" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Desktop Launchers</text>
  <text x="65" y="264" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• ./start_vnc.sh (Web browser mode)</text>
  <text x="65" y="288" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• ./start_x.sh (Native OS X11 mode)</text>
  <text x="65" y="312" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• ./start_shell.sh (CLI / Headless mode)</text>

  <!-- Bidirectional Bridge Arrow -->
  <path d="M 400 135 L 470 135" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrB)"/>
  <path d="M 470 145 L 400 145" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="435" y="120" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Volume</text>
  <text x="435" y="170" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mount</text>

  <!-- Right: Container -->
  <rect x="470" y="30" width="420" height="340" rx="12" fill="#062e24" fill-opacity="0.4" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="60" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    🐳 IIC-OSIC-TOOLS (hpretl/iic-osic-tools)
  </text>
  <text x="680" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Mount Point: /foss/designs/
  </text>

  <rect x="490" y="95" width="380" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="122" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">50+ Pre-Installed EDA Tools:</text>
  <text x="510" y="146" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• Digital: Yosys, OpenROAD, OpenSTA, Verilator</text>
  <text x="510" y="168" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• Analog: Xschem, ngspice, gaw, xyce</text>
  <text x="510" y="190" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">• Physical Verification: Magic, Netgen, KLayout</text>
  <text x="510" y="212" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">• Multi-PDKs: Sky130A, GF180MCU, IHP-SG13G2 (sak-pdk)</text>

  <rect x="490" y="235" width="380" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="510" y="262" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Built-In Desktop Output:</text>
  <text x="510" y="288" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• HTML5 Web Desktop: http://localhost:80</text>
  <text x="510" y="312" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Native WSLg / X11 Window Forwarding</text>
</svg>