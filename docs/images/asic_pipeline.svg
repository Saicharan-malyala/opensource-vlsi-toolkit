<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bgP)" stroke="#1e293b" stroke-width="2"/>

  <!-- Step 1: RTL -->
  <rect x="40" y="35" width="240" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. RTL Source Code</text>
  <text x="160" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Verilog / SystemVerilog (.v, .sv)</text>

  <!-- Step 1 Simulation Branch -->
  <path d="M 160 95 L 160 140" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="140" width="240" height="60" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="160" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Functional Simulation</text>
  <text x="160" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">iverilog, Verilator &amp; GTKWave</text>

  <!-- Step 2: Synthesis -->
  <path d="M 280 65 L 360 65" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360" y="35" width="250" height="60" rx="10" fill="#1e1e38" stroke="#a855f7" stroke-width="2"/>
  <text x="485" y="60" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Logic Synthesis</text>
  <text x="485" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Yosys (Gate Netlist .v)</text>

  <!-- Step 3: Physical Implementation -->
  <path d="M 485 95 L 485 140" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="340" y="140" width="290" height="150" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
  <text x="485" y="168" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Physical Implementation (OpenROAD)</text>
  <text x="360" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Floorplanning &amp; IO Pin Placement</text>
  <text x="360" y="218" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Standard Cell Placement</text>
  <text x="360" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Clock Tree Synthesis (CTS)</text>
  <text x="360" y="262" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Global &amp; Detailed Routing (TritonRoute)</text>

  <!-- Step 4: Verification & Signoff -->
  <path d="M 630 215 L 700 215" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="700" y="140" width="230" height="150" rx="12" fill="#7c2d12" fill-opacity="0.3" stroke="#f97316" stroke-width="2"/>
  <text x="815" y="168" fill="#fb923c" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Signoff &amp; Verification</text>
  <text x="720" y="200" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• OpenSTA (Timing Signoff)</text>
  <text x="720" y="225" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Magic (DRC Rule Check)</text>
  <text x="720" y="250" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Netgen (LVS Comparison)</text>

  <!-- Step 5: Final Tapeout Streamout -->
  <path d="M 815 290 L 815 330" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="680" y="330" width="260" height="65" rx="10" fill="#713f12" fill-opacity="0.5" stroke="#facc15" stroke-width="2"/>
  <text x="810" y="358" fill="#fde047" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5. Final Tapeout GDSII / OASIS</text>
  <text x="810" y="378" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Mask Inspection with KLayout</text>
</svg>